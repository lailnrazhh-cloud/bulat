<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Kartu Bilangan Bulat - Pembelajaran Visual</title>
  <style>
    :root {
      --positif-color: #2e7d32;
      --positif-bg: #e8f5e9;
      --negatif-color: #c62828;
      --negatif-bg: #ffebee;
      --neutral-bg: #f5f5f5;
      --text-dark: #212121;
    }

    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      color: var(--text-dark);
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #1565c0;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      font-size: 18px;
      color: #666;
      margin-bottom: 25px;
      font-weight: 600;
    }

    /* Area Kontrol Input */
    .control-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      background-color: var(--neutral-bg);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    label {
      font-size: 20px;
      font-weight: bold;
    }

    input[type="number"] {
      width: 80px;
      padding: 10px;
      font-size: 22px;
      text-align: center;
      border: 3px solid #ccc;
      border-radius: 8px;
      font-weight: bold;
    }

    select {
      padding: 10px;
      font-size: 22px;
      font-weight: bold;
      border: 3px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
    }

    button {
      padding: 12px 24px;
      font-size: 20px;
      font-weight: bold;
      background-color: #1565c0;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #0d47a1;
    }

    /* Visualisasi Area Kartu */
    .board {
      display: flex;
      flex-direction: column;
      gap: 20px;
      min-height: 250px;
      padding: 20px;
      border: 3px dashed #bbb;
      border-radius: 12px;
      background-color: #fafafa;
    }

    .card-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 10px;
      border-radius: 8px;
      background: white;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
    }

    .row-title {
      width: 100%;
      font-weight: bold;
      font-size: 18px;
      margin-bottom: 5px;
      color: #444;
    }

    /* Elemen Kartu */
    .card {
      width: 60px;
      height: 75px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: 900;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      transition: all 0.4s ease;
      user-select: none;
    }

    .card.positive {
      background-color: var(--positif-bg);
      color: var(--positif-color);
      border: 4px solid var(--positif-color);
    }

    .card.negative {
      background-color: var(--negatif-bg);
      color: var(--negatif-color);
      border: 4px solid var(--negatif-color);
    }

    .card.neutral-pair {
      opacity: 0.25;
      transform: scale(0.85);
      border-style: dashed;
    }

    /* Area Hasil Visual */
    .result-box {
      margin-top: 25px;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      background-color: #e3f2fd;
      border: 3px solid #90caf9;
    }

    .result-text {
      font-size: 32px;
      font-weight: bold;
      color: #0d47a1;
    }

    .visual-guide {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin-top: 15px;
      font-size: 16px;
      font-weight: bold;
    }

    .guide-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .mini-card {
      width: 25px;
      height: 30px;
      border-radius: 4px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🟨 MEDIA KARTU BILANGAN BULAT 🟦</h1>
  <div class="subtitle">Belajar Penjumlahan & Pengurangan Secara Visual</div>

  <!-- Petunjuk Warna -->
  <div class="visual-guide">
    <div class="guide-item">
      <span class="mini-card" style="background:var(--positif-bg); color:var(--positif-color); border:2px solid var(--positif-color);">+</span>
      <span>Kartu Positif (+1)</span>
    </div>
    <div class="guide-item">
      <span class="mini-card" style="background:var(--negatif-bg); color:var(--negatif-color); border:2px solid var(--negatif-color);">-</span>
      <span>Kartu Negatif (-1)</span>
    </div>
    <div class="guide-item">
      <span>( + ) + ( - ) = 0 (Pasangan Netral)</span>
    </div>
  </div>

  <br>

  <!-- Panel Input Angka -->
  <div class="control-panel">
    <div class="input-group">
      <label for="num1">Bilangan 1:</label>
      <input type="number" id="num1" value="3" min="-10" max="10">
    </div>

    <select id="operator">
      <option value="+">+</option>
      <option value="-">-</option>
    </select>

    <div class="input-group">
      <label for="num2">Bilangan 2:</label>
      <input type="number" id="num2" value="-2" min="-10" max="10">
    </div>

    <button onclick="hitung()">TAMPILKAN KARTU</button>
  </div>

  <!-- Area Kartu -->
  <div class="board" id="board">
    <!-- Kartu akan dirender di sini melalui JavaScript -->
  </div>

  <!-- Kotak Hasil -->
  <div class="result-box">
    <div class="result-text" id="result-text">3 + (-2) = 1</div>
  </div>
</div>

<script>
  function renderCards(containerId, count, isPositive) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    const absCount = Math.abs(count);

    for (let i = 0; i < absCount; i++) {
      const card = document.createElement('div');
      card.className = `card ${isPositive ? 'positive' : 'negative'}`;
      card.textContent = isPositive ? '+' : '-';
      container.appendChild(card);
    }
  }

  function hitung() {
    let n1 = parseInt(document.getElementById('num1').value) || 0;
    let n2 = parseInt(document.getElementById('num2').value) || 0;
    const op = document.getElementById('operator').value;
    const board = document.getElementById('board');
    const resultText = document.getElementById('result-text');

    board.innerHTML = '';

    // Pembentukan ekspresi asli & konversi pengurangan jika ada
    let effectiveN2 = n2;
    if (op === '-') {
      effectiveN2 = -n2; // Pengurangan sama dengan menambah lawan
    }

    const totalHasil = n1 + effectiveN2;

    // 1. Tampilkan Baris Bilangan Pertama
    const row1 = document.createElement('div');
    row1.className = 'card-row';
    row1.innerHTML = `<div class="row-title">Bilangan Pertama: ${n1}</div><div id="cards-n1" style="display:flex; gap:8px; flex-wrap:wrap;"></div>`;
    board.appendChild(row1);
    renderCards('cards-n1', n1, n1 >= 0);

    // 2. Tampilkan Baris Bilangan Kedua
    const row2 = document.createElement('div');
    row2.className = 'card-row';
    const labelN2 = op === '-' ? `Dioperasikan (- ${n2} menjadi ${effectiveN2 >= 0 ? '+' : ''}${effectiveN2})` : `Bilangan Kedua: ${n2}`;
    row2.innerHTML = `<div class="row-title">${labelN2}</div><div id="cards-n2" style="display:flex; gap:8px; flex-wrap:wrap;"></div>`;
    board.appendChild(row2);
    renderCards('cards-n2', effectiveN2, effectiveN2 >= 0);

    // 3. Tampilkan Area Penggabungan / Pasangan Netral
    const rowNetral = document.createElement('div');
    rowNetral.className = 'card-row';
    rowNetral.style.backgroundColor = '#f0f4c3';
    rowNetral.innerHTML = `<div class="row-title">Proses Pasangan Netral (+ dan - saling menghilangkan = 0):</div><div id="cards-netral" style="display:flex; gap:8px; flex-wrap:wrap;"></div>`;
    board.appendChild(rowNetral);

    const containerNetral = document.getElementById('cards-netral');

    // Menghitung berapa banyak pasangan netral (netralisasi)
    let posCount = (n1 > 0 ? n1 : 0) + (effectiveN2 > 0 ? effectiveN2 : 0);
    let negCount = (n1 < 0 ? Math.abs(n1) : 0) + (effectiveN2 < 0 ? Math.abs(effectiveN2) : 0);
    
    let neutralPairs = Math.min(posCount, negCount);
    let remPos = posCount - neutralPairs;
    let remNeg = negCount - neutralPairs;

    // Render Pasangan Netral (Dibuat transparan/redup)
    for (let i = 0; i < neutralPairs; i++) {
      const pairGroup = document.createElement('div');
      pairGroup.style.display = 'flex';
      pairGroup.style.gap = '4px';
      pairGroup.style.padding = '4px';
      pairGroup.style.border = '2px dashed #9e9e9e';
      pairGroup.style.borderRadius = '8px';

      const pCard = document.createElement('div');
      pCard.className = 'card positive neutral-pair';
      pCard.textContent = '+';

      const nCard = document.createElement('div');
      nCard.className = 'card negative neutral-pair';
      nCard.textContent = '-';

      pairGroup.appendChild(pCard);
      pairGroup.appendChild(nCard);
      containerNetral.appendChild(pairGroup);
    }

    // Render Sisa Kartu yang menjadi hasil
    for (let i = 0; i < remPos; i++) {
      const card = document.createElement('div');
      card.className = 'card positive';
      card.textContent = '+';
      containerNetral.appendChild(card);
    }

    for (let i = 0; i < remNeg; i++) {
      const card = document.createElement('div');
      card.className = 'card negative';
      card.textContent = '-';
      containerNetral.appendChild(card);
    }

    if (neutralPairs === 0 && remPos === 0 && remNeg === 0) {
      containerNetral.innerHTML = '<em>Satu pun tidak ada kartu (Hasil = 0)</em>';
    }

    // Update Teks Hasil Operasi
    const opDisplay = op === '-' ? '-' : '+';
    const n2Display = n2 < 0 ? `(${n2})` : n2;
    resultText.textContent = `${n1} ${opDisplay} ${n2Display} = ${totalHasil}`;
  }

  // Jalankan render awal
  hitung();
</script>

</body>
</html>
